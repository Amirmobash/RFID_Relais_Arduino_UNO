<text x="468" y="190" font-family="sans-serif" font-size="16">MFRC522 SCK</text>
<rect x="30" y="212" width="350" height="32" rx="5" fill="#dbeafe"/>
<text x="42" y="234" font-family="sans-serif" font-size="16">D11</text>
<line x1="380" y1="228" x2="455" y2="228" stroke="#2563eb" stroke-width="2"/>
