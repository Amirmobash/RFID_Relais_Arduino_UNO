<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="468" viewBox="0 0 1000 468" role="img" aria-labelledby="title desc">
<title id="title">RFID relay controller for Arduino Uno signal assignments</title>
<desc id="desc">Source and selected-board pin map. Power, voltage adaptation, protection and load circuits are not specified.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="32" font-family="sans-serif" font-size="21" fill="#0f172a">Arduino Uno</text>
<text x="30" y="59" font-family="sans-serif" font-size="15" fill="#475569">Source-derived signal map; no claim of physical verification</text>
<rect x="30" y="80" width="350" height="32" rx="5" fill="#dbeafe"/>
<text x="42" y="102" font-family="sans-serif" font-size="16">D10</text>
<line x1="380" y1="96" x2="455" y2="96" stroke="#2563eb" stroke-width="2"/>
